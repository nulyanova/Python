{% extends "base.html" %}

{% block content %}
    <h2>{% if form.instance.pk %}Редактировать заметку{% else %}Создать заметку{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить</button>
    </form>
    <a href="{% url 'note_list' %}">Назад к списку заметок</a>
{% endblock %}
