{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Приложение заметок{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body style="background-image: url('{% static "images/notebook_bg.png" %}'); background-size: cover; background-position: center;">

    <header>
        <h1>📔 Приложение заметок</h1>
        <nav>
            {% if user.is_authenticated %}
                <p>✏️ Привет, {{ user.username }}!</p>
                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit">🚪 Выход</button>
                </form>
            {% else %}
                <p>
                    <a href="{% url 'login' %}">🔑 Войти</a> |
                    <a href="{% url 'signup' %}">📝 Регистрация</a>
                </p>
            {% endif %}
        </nav>
    </header>

    <main class="notebook">
        {% block content %}{% endblock %}
    </main>


</body>
</html>
